name: Build macOS DMG

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run dist:dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desk-Wellness-macOS
          path: dist/*.dmg
          retention-days: 30
